<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tesla Auth Callback</title>
    <style>
        body { font-family: sans-serif; padding: 40px; line-height: 1.6; }
        .code-box { background: #f4f4f4; padding: 15px; border: 1px solid #ccc; word-break: break-all; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Tesla Authorization Code Retrieved Successfully</h2>
    <p>Copy the code below to use in your application:</p>
    <div id="auth-code" class="code-box">Searching for code...</div>

    <script>
        // Parse the URL parameters to find the 'code' sent by Tesla
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            document.getElementById('auth-code').innerText = code;
        } else {
            document.getElementById('auth-code').innerText = "No authorization code found in the URL. Ensure you arrived here via Tesla's OAuth redirect.";
        }
    </script>
</body>
</html>
