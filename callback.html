<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Auth Debugger</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; color: #333; line-height: 1.6; }
        h2 { border-bottom: 2px solid #eaecef; padding-bottom: 10px; color: #24292e; }
        .param-group { margin-bottom: 20px; }
        .label { font-weight: bold; color: #586069; text-transform: uppercase; font-size: 0.85rem; display: block; margin-bottom: 5px; }
        .code-box { background: #f6f8fa; padding: 15px; border: 1px solid #e1e4e8; border-radius: 6px; word-break: break-all; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.9rem; min-height: 1.5em; }
        .missing { color: #d73a49; font-style: italic; background: #ffeef0; border-color: #f9c2c9; }
    </style>
</head>
<body>
    <h2>Tesla OAuth Callback Data</h2>
    <p>The following parameters were successfully extracted from the redirect URL:</p>

    <div class="param-group">
        <span class="label">Authorization Code (code)</span>
        <div id="auth-code" class="code-box">Extracting...</div>
    </div>

    <div class="param-group">
        <span class="label">State Parameter (state)</span>
        <div id="auth-state" class="code-box">Extracting...</div>
    </div>

    <div class="param-group">
        <span class="label">Issuer (iss)</span>
        <div id="auth-issuer" class="code-box">Extracting...</div>
    </div>

    <script>
        // Parse URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        // OAuth 2.0 security best practice often uses 'iss' as the key for issuer
        const issuer = urlParams.get('iss') || urlParams.get('issuer');

        // Helper function to update UI elements
        function displayParam(elementId, value, paramName) {
            const element = document.getElementById(elementId);
            if (value) {
                element.innerText = value;
            } else {
                element.innerText = `Not found: '${paramName}' parameter is missing from the URL.`;
                element.classList.add('missing');
            }
        }

        // Render parameters onto the page
        displayParam('auth-code', code, 'code');
        displayParam('auth-state', state, 'state');
        displayParam('auth-issuer', issuer, 'iss/issuer');
    </script>
</body>
</html>
